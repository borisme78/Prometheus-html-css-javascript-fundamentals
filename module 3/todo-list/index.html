<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Список справ</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <h1 id="myHeader">Список справ</h1>
  <p>Додай справу, познач її важливою або виконаною. Видалити можна лише виконані справи.</p>
  <form id="taskForm">
    <label for="input">Нова справа:</label>
    <input type="text" id="input" placeholder="Введіть справу…">
    <input type="button" id="addButton" value="Додати" onclick="addTask()">
  </form>
  <hr>
  <ul id="tasks"></ul>
  <hr>
  <div id="divabout" role="status"></div>
  <button type="button" onclick="doAbout()">Про автора</button>
  <button type="button" onclick="clearAbout()">Очистити інформацію</button>
  <p id="status" role="status"></p>
  <script src="./script.js"></script>
</body>
</html>
