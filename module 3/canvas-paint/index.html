<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Інтерактивне полотно для малювання</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <h1>Інтерактивне полотно для малювання</h1>
  <p>Малюй на полотні мишею або пальцем. Нижче можна вибрати колір і розмір пензля.</p>
  <p>
    <label>Ширина: <input type="number" id="widthInput" min="1" max="2000" step="1" value="600" onchange="setWidth(this)"></label>
    <label>Висота: <input type="number" id="heightInput" min="1" max="2000" step="1" value="300" onchange="setHeight(this)"></label>
  </p>
  <canvas id="canvas1" width="600" height="300">Ваш браузер не підтримує Canvas.</canvas>
  <p>
    <label>Колір пензля: <input type="color" id="brushColor" value="#000000" oninput="changeColor(this.value)"></label>
    <label>Радіус пензля: <input type="range" id="sizeInput" min="1" max="50" value="50" oninput="resizeBrush(this.value)"></label>
    <output id="sizeOutput" for="sizeInput">50</output>
  </p>
  <button type="button" id="clear" onclick="clearCanvas()">Очистити полотно</button>
  <p id="status" role="status">Зміна розміру очищає малюнок.</p>
  <script src="./script.js"></script>
</body>
</html>
