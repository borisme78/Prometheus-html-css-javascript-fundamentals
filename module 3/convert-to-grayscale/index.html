<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Перетворення зображення на відтінки сірого</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <h1>Перетворення зображення на відтінки сірого</h1>
  <p>Завантаж зображення та натисни «Зробити сірим». Ліворуч буде оригінал, праворуч — результат.</p>
  <canvas id="can1" width="400" height="300" aria-label="Оригінал"></canvas>
  <canvas id="can2" width="400" height="300" aria-label="Результат"></canvas>
  <p><label>Зображення: <input type="file" accept="image/*" id="finput" onchange="upload()"></label></p>
  <button type="button" id="grayscale" onclick="makeGray()" disabled>Зробити сірим</button>
  <p id="status" role="status"></p>
  <script src="./script.js"></script>
</body>
</html>
