<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Практика роботи з Canvas</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <h1>Практика роботи з Canvas</h1>
  <p>Натискай кнопки, змінюй кольори та пересувай повзунок, щоб намалювати квадрат.</p>
  <canvas id="d1" width="200" height="120" aria-label="Перше полотно"></canvas>
  <canvas id="d2" width="200" height="120" aria-label="Друге полотно"></canvas>
  <canvas id="d3" width="200" height="120" aria-label="Квадрат"></canvas>
  <p>
    <button type="button" onclick="changeColor()">Змінити кольори</button>
    <button type="button" onclick="doRed()">Червоний</button>
    <button type="button" onclick="doBlue()">Синій</button>
    <label>Колір другого полотна: <input type="color" value="#00ff00" oninput="doColor()" id="clr"></label>
    <label>Розмір квадрата: <input type="range" min="10" max="100" value="10" id="sldr" oninput="drawSquare()"></label>
  </p>
  <script src="./script.js"></script>
