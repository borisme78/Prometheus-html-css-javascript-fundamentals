<body>
  <h1>Завантаження зображення та очищення полотна</h1>
  <p>Завантаж зображення. Кнопка очищає полотно і вибраний файл.</p>
  <canvas id="can" width="600" height="300">Ваш браузер не підтримує Canvas.</canvas>
  <p><label>Зображення: <input type="file" accept="image/*" id="file" onchange="upload()"></label></p>
  <button type="button" onclick="resetImage()">Очистити зображення</button>
  <p id="status" role="status"></p>
  <script src="./script.js"></script>
