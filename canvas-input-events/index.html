<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Елементи вводу й події на Canvas</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <h1>Елементи вводу й події на Canvas</h1>
  <p>Вибери колір тла і двох квадратів. Повзунок змінює розмір квадратів.</p>
  <canvas id="c1" width="300" height="150">Ваш браузер не підтримує Canvas.</canvas>
  <p>
    <label>Колір тла: <input type="color" value="#ffffff" id="cl" oninput="changeColor()"></label>
    <button type="button" onclick="changeColor()">Змінити колір тла</button>
  </p>
  <p>
    <label>Розмір квадратів: <input type="range" min="10" max="100" value="10" id="sldr" oninput="drawSquares()"></label>
    <label>Перший квадрат: <input type="color" value="#ff0000" id="col1" oninput="drawSquares()"></label>
    <label>Другий квадрат: <input type="color" value="#0000ff" id="col2" oninput="drawSquares()"></label>
  </p>
  <script src="./script.js"></script>
